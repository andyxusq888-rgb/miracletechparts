name: Deploy MiracleTech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare verified static build
        shell: bash
        run: |
          set -euo pipefail
          base="https://miracletechparts.ok.kimi.link"
          files=(
            index.html products.html about.html how-to-order.html contact.html order.html
            robots.txt sitemap.xml css/style.css js/main.js js/order.js
            assets/favicon.svg assets/icons.svg
            assets/fonts/ibm-plex-mono-medium.ttf
            assets/fonts/manrope-bold.ttf
            assets/fonts/manrope-extrabold.ttf
            assets/fonts/manrope-regular.ttf
            assets/fonts/manrope-semibold.ttf
            assets/images/components.webp
            assets/images/hero.webp
            assets/images/products.webp
            assets/images/quality.webp
          )
          mkdir -p dist
          for file in "${files[@]}"; do
            mkdir -p "dist/$(dirname "$file")"
            curl --fail --silent --show-error --location --retry 3 --output "dist/$file" "$base/$file"
          done
          printf 'miracletechparts.shop\n' > dist/CNAME
          touch dist/.nojekyll
          test -s dist/index.html
          grep -q 'Your reliable' dist/index.html
      - name: Remove publishing-platform injections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def decode(value):
              key = int(value[:2], 16)
              return ''.join(chr(int(value[i:i + 2], 16) ^ key) for i in range(2, len(value), 2))

          for path in Path('dist').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<script\b[^>]*\bsrc="https://www\.kimi\.com/sdk-seed\.js"[^>]*>\s*</script>', '', text)
              text = re.sub(r'<script\b[^>]*\bsrc="/cdn-cgi/scripts/[^"]*/email-decode\.min\.js"[^>]*>\s*</script>', '', text)
              text = re.sub(r'<span\b(?=[^>]*class="__cf_email__")(?=[^>]*data-cfemail="([0-9a-fA-F]+)")[^>]*>.*?</span>', lambda m: decode(m.group(1)), text, flags=re.DOTALL)
              text = re.sub(r'href="/cdn-cgi/l/email-protection#([0-9a-fA-F]+)"', lambda m: 'href="mailto:' + decode(m.group(1)) + '"', text)
              for marker in ('sdk-seed.js', '/cdn-cgi/', '__cf_email__', 'data-cfemail='):
                  if marker in text:
                      raise RuntimeError(f'{path.name}: leftover {marker}')
              if 'mailto:andyxusq888@gmail.com' not in text:
                  raise RuntimeError(f'{path.name}: email link was not restored')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
